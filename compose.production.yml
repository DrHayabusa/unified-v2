name: mva-unified-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mva
      POSTGRES_USER: mva
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - mva-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mva -d mva"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./server
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: mva
      DATABASE_USER: mva
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      HOST: 0.0.0.0
      PORT: 8787
      CORS_ORIGINS: ${MVA_PUBLIC_ORIGIN:?Set MVA_PUBLIC_ORIGIN in .env.production}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-2}
      LITELLM_URL: ${LITELLM_URL:-http://host.docker.internal:4000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?Set LITELLM_API_KEY in .env.production}
      LITELLM_MODEL: ${LITELLM_MODEL:?Set LITELLM_MODEL in .env.production}
      LITELLM_CONNECT_TIMEOUT_MS: ${LITELLM_CONNECT_TIMEOUT_MS:-10000}
      LITELLM_READ_TIMEOUT_MS: ${LITELLM_READ_TIMEOUT_MS:-600000}
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./react-ui
      dockerfile: Dockerfile.local
      args:
        VITE_MVA_DATABASE_API_URL: same-origin
    ports:
      - "${MVA_LISTEN_ADDRESS:-127.0.0.1}:${MVA_FRONTEND_PORT:-8820}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

volumes:
  mva-postgres-data:

secrets:
  postgres_password:
    file: ${MVA_POSTGRES_PASSWORD_FILE:-./.secrets/postgres_password}
